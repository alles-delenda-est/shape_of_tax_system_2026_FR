<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Système fiscal français 2023 — aperçu sunburst</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #chart { width: 100vw; height: 100vh; }
  #reset {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 7px 14px;
    font: 600 13px/1 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #ffffff;
    color: #162033;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(15,23,42,0.08);
    z-index: 10;
    display: none;
  }
  #reset:hover { background: #f1f5f9; }
  #reset:active { background: #e2e8f0; }
  #fallback { padding: 2rem; max-width: 720px; line-height: 1.55; color: #1a2533; }
  #fallback code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
  #fallback h1 { font-size: 1.2rem; margin-top: 0; }
</style>
</head>
<body>
<button id="reset" type="button" title="Revenir à la vue d'ensemble">↺ Vue d'ensemble</button>
<div id="chart"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
const el = document.getElementById('chart');
const resetBtn = document.getElementById('reset');
const chart = echarts.init(el);
let originalOption = null;

fetch('fr_tax_system_sunburst_2023.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(option => {
    originalOption = option;
    chart.setOption(option);
    window.addEventListener('resize', () => chart.resize());
    resetBtn.style.display = 'inline-block';
  })
  .catch(err => {
    document.body.innerHTML =
      '<div id="fallback">' +
      '<h1>Impossible de charger le JSON (' + err.message + ')</h1>' +
      '<p>Les navigateurs bloquent <code>fetch()</code> sur <code>file://</code>. ' +
      'Démarrez un petit serveur HTTP local dans ce dossier :</p>' +
      '<pre><code>python3 -m http.server 8000</code></pre>' +
      '<p>puis ouvrez <a href="http://localhost:8000/">http://localhost:8000/</a>.</p>' +
      '</div>';
  });

resetBtn.addEventListener('click', () => {
  if (!originalOption) return;
  // Preserve the currently selected timeline tab (UK · Md€ / UK · % PIB / FR · Md€ / FR · % PIB).
  const current = chart.getOption();
  let timelineIdx = 0;
  if (current.timeline && current.timeline[0] && typeof current.timeline[0].currentIndex === 'number') {
    timelineIdx = current.timeline[0].currentIndex;
  }
  chart.setOption(originalOption, true);
  if (timelineIdx > 0) {
    chart.dispatchAction({ type: 'timelineChange', currentIndex: timelineIdx });
  }
});
</script>
</body>
</html>
